version: "3.8"

services:
    db:
        image: postgres:15
        container_name: movie_db
        restart: always
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: movie_reviews
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U user -d movie_reviews"]
            interval: 5s
            timeout: 5s
            retries: 5

    backend:
        build: ../backend
        container_name: movie_backend
        restart: always
        environment:
            - DATABASE_URL=postgresql://user:password@db:5432/movie_reviews
            - TMDB_API_KEY=17SF45M-ANE49MZ-PPZNCQQ-ARJF5RY
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "8000:8000"

    frontend:
        build: ../frontend
        container_name: movie_frontend
        restart: always
        ports:
            - "80:80"
        depends_on:
            - backend

volumes:
    postgres_data:
